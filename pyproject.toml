[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gen1recomp-translation-mods"
version = "0.7.0"
description = "Reproducible multilingual translation mod generator for Gen1Recomp"
requires-python = ">=3.11"

[project.scripts]
translation-pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
