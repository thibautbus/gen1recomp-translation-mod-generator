# Optional local ROM paths for build_translation.py.
# This example is tracked; copy it to rom_paths.toml and edit the paths.
# Relative paths are resolved relative to this configuration file.

[rom]
red = "/absolute/path/to/PokemonRed.gb"
blue = "/absolute/path/to/PokemonBlue.gb"
yellow = "/absolute/path/to/PokemonYellow.gb"
gold = "/absolute/path/to/PokemonGold.gbc"
silver = "/absolute/path/to/PokemonSilver.gbc"
crystal = "/absolute/path/to/PokemonCrystal.gbc"
# On Windows, TOML literal strings keep backslashes readable:
# red = 'C:\Games\PokemonRed.gb'
# blue = 'D:\Games\PokemonBlue.gb'
# yellow = 'D:\Games\PokemonYellow.gb'
# gold = 'D:\Games\PokemonGold.gbc'
# silver = 'D:\Games\PokemonSilver.gbc'
# crystal = 'D:\Games\PokemonCrystal.gbc'
