[gen1recomp]
# Immutable engine source used by the interactive builder and Modkit.
# Pinned at v0.3.14, the upstream release used to validate and package the
# RBY, Gold/Silver, Crystal and FireRed translation mods.  Since v0.3.4,
# FireRed draws most of its own text from the cart instead of English
# literals (option menu, summary pages, intro, Pokedex, region map, battle
# messages, stat names...), so a mod translates them through the cart's
# rows; the engine also names an egg by the language's EGG (gen1recomp#2396),
# recognises trainer classes by id so the class names can be translated
# (gen1recomp#2398), takes Unicode braille cells (gen1recomp#2400) and draws
# Japanese with the cart's own fonts (gen1recomp#2406).
source = "https://github.com/bryanthaboi/gen1recomp.git"
revision = "591bf4d6d605b15a0f2990efa8e024aece3c54b5"
archive_url = "https://codeload.github.com/bryanthaboi/gen1recomp/zip/591bf4d6d605b15a0f2990efa8e024aece3c54b5"
archive_sha256 = "6964a8802ce3ed0e52efa4adea746d61a9e97c0ce9e935b1e630b5c1be400006"
archive_tree_sha256 = "03f65a2b75bb36137a56086694a08f40e546d391239a83839ad82966ed40db0f"

# pret's FireRed decompilation data the FireRed release joins through (never
# code, never game text): the symbol table names every ROM address the game3
# extractor keys dialogue by, and the charmap is the cart's text encoding.
# The symbols are the pret "symbols" branch build of FireRed (US) v1.0, the
# ROM fingerprinted under [rom.firered].
[pret.symbols]
source = "https://github.com/pret/pokefirered.git"
revision = "3b401eaf14f193946899eb7c056d5ac02a470126"
archive_base_url = "https://raw.githubusercontent.com/pret/pokefirered/3b401eaf14f193946899eb7c056d5ac02a470126"

