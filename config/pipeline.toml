[corpus]
# Local checkout or archive of poke-corpus. Never commit this directory.
path = "../poke-corpus"
source = "https://github.com/abcboy101/poke-corpus.git"
revision = "aa2885972ce76d29bcc18a5179f6ee411a60c8f8"
# Standalone mode downloads only these exact files from the pinned commit.
archive_base_url = "https://raw.githubusercontent.com/abcboy101/poke-corpus/aa2885972ce76d29bcc18a5179f6ee411a60c8f8"
format = "corpus/RedBlue/{qid,en,<target_lang>}_msg.txt (UTF-8 parallel lines)"
target_lang = "fr"

