[gen1recomp]
# Immutable engine source used by the interactive builder and Modkit.
# Pinned at v0.3.63, which carries Ruby and Sapphire
# (gen1recomp 67748895, released in v0.3.52), the Emerald screens translation
# mods reach (gen1recomp#2678, released in v0.3.53), the Ruby and Sapphire
# screens they reach (gen1recomp#2724, released in v0.3.58), Ruby and
# Sapphire's starter category and secret base name (gen1recomp#2743, #2745)
# and the metric Pokedex heights and weights (gen1recomp#2747), all three
# released in v0.3.61, used to validate and
# package the RBY, Gold/Silver, Crystal, FireRed/LeafGreen and
# Ruby/Sapphire/Emerald translation mods.
# Since v0.3.4, FireRed draws most of its own text from the cart instead of
# English literals (option menu, summary pages, intro, Pokedex, region map,
# battle messages, stat names...), so a mod translates them through the cart's
# rows; the engine also names an egg by the language's EGG (gen1recomp#2396),
# recognises trainer classes by id so the class names can be translated
# (gen1recomp#2398), takes Unicode braille cells (gen1recomp#2400) and draws
# Japanese with the cart's own fonts (gen1recomp#2406).
source = "https://github.com/bryanthaboi/gen1recomp.git"
revision = "7ab2f86586d73b9cf73d07915086ca89071ed887"
archive_url = "https://codeload.github.com/bryanthaboi/gen1recomp/zip/7ab2f86586d73b9cf73d07915086ca89071ed887"
archive_sha256 = "fd61319212fb842192471c3ebda5fb53bcaf4d1c32012f5bc09aa644c5e9c22f"
archive_tree_sha256 = "a8cde077b9dc19efa6ea6a8b2acce1cbf85b068d5e2b483ff56a56d01189b55c"

